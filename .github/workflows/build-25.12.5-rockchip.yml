name: Build aic8800 apk (25.12.5 rockchip/armv8)
# Builds the AICSemi AIC8800 driver as standalone apk packages against the
# official OpenWrt 25.12.5 SDK for rockchip/armv8, and publishes them as a
# GitHub release.
#
# The point of using the official SDK rather than a tree of our own is the
# kernel ABI: the SDK carries the same kernel config the released images were
# built with, so the module comes out with the published vermagic and installs
# on a stock 25.12.5 rockchip image - including the NanoPi R28S build, whose
# kernel config is that same official one.
#
# Nothing here belongs in an OpenWrt tree. The driver is an out-of-tree vendor
# blob-loader that upstream would not take, and keeping it separate means the
# firmware images stay buildable from a clean OpenWrt checkout.

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose make (V=s)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - 'aic8800-25.12.5-*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_URL: https://downloads.openwrt.org/releases/25.12.5/targets/rockchip/armv8/openwrt-sdk-25.12.5-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  SDK_SHA256: 59194a023968398af64bfa7d8bc3eac322641f6dc9cdbade28a4d9dd41866eba
  SDK_DIR: openwrt-sdk-25.12.5-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64
  # Published in targets/rockchip/armv8/kmods/ for 25.12.5. The SDK must
  # arrive at this on its own; a mismatch means the module would refuse to
  # load on a stock image, which is the whole point of this build.
  EXPECTED_KERNEL: 6.12.94-1
  EXPECTED_VERMAGIC: 5fab3a97d147fbf8146094eeebd78fd9

jobs:
  build:
    name: aic8800 sdio apk (25.12.5 rockchip/armv8)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert the patches survived checkout byte for byte
        # Parts of the vendor source are CRLF, so four of these patches carry
        # CRLF context lines and have to reach quilt exactly as they are.
        # Anything that normalises line endings - a checkout on a machine with
        # core.autocrlf, a well-meaning editor - turns them into
        # "Hunk #1 FAILED (different line endings)" a good ten minutes into the
        # run. .gitattributes marks the tree -text to prevent it; this proves
        # it worked.
        run: |
          fail=0
          for f in 020-wireless-6.16 030-update-firmware-path \
                   050-log-level 080-fix-export-symbols-conflict; do
            p="package/aic8800/patches/$f.patch"
            if grep -qU $'\r' "$p"; then
              echo "  $f.patch: CRLF intact"
            else
              echo "::error::$p lost its CRLF line endings - quilt will reject it"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-dev \
            python3 python3-pyelftools rsync swig unzip zlib1g-dev file wget zstd \
            ccache libelf-dev libdw-dev liblz4-dev libzstd-dev libxml-parser-perl
          # OpenWrt runs a prereq pass over every selected package before it
          # builds anything, and the base feed brings uboot-rockchip along -
          # which sets UBOOT_USE_BINMAN and so demands an importable elftools.
          # It has nothing to do with this driver and everything to do with
          # whether `make package/aic8800/compile` gets to start at all.
          python3 -c 'import elftools' \
            || { echo "::error::python3-pyelftools is not importable - the package prereq pass needs it"; exit 1; }

      - name: Fetch and unpack the official SDK
        run: |
          curl -fsSL --retry 3 -o sdk.tar.zst "$SDK_URL"
          echo "$SDK_SHA256  sdk.tar.zst" | sha256sum -c -
          tar --zstd -xf sdk.tar.zst
          [ -d "$SDK_DIR" ] || { echo "::error::unpacked SDK directory $SDK_DIR not found"; exit 1; }
          rm -f sdk.tar.zst
          echo "----- SDK feeds.conf.default -----"
          cat "$SDK_DIR/feeds.conf.default"

      - name: Add this repository as a feed
        run: |
          cd "$SDK_DIR"
          # The SDK ships a generated 'base' feed pointing at the openwrt tree
          # this SDK was cut from, which is where package/kernel/mac80211 comes
          # from - the driver is built against its cfg80211 backport, not the
          # in-kernel one, so without it nothing here resolves.
          grep -q '^src-git --root=package base ' feeds.conf.default \
            || { echo "::error::the SDK has no base feed - kmod-cfg80211 would be unresolvable"; exit 1; }
          cp feeds.conf.default feeds.conf
          echo "src-link aic8800 ${GITHUB_WORKSPACE}/package" >> feeds.conf
          cat feeds.conf

      - name: Update feeds
        run: |
          cd "$SDK_DIR"
          # git.openwrt.org answers 504 now and then; a failed clone leaves a
          # half-empty feed behind, so retry the update from scratch.
          for i in 1 2 3 4; do
            ./scripts/feeds update -a && break
            echo "feeds update failed (attempt $i), retrying"
            rm -rf feeds
            sleep 30
          done
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd "$SDK_DIR"
          {
            echo 'CONFIG_PACKAGE_kmod-aic8800-sdio=m'
            echo 'CONFIG_PACKAGE_aic8800-sdio-firmware=y'
            echo 'CONFIG_AIC8800_SDIO_BT_SUPPORT=y'
            echo 'CONFIG_BUILD_LOG=y'
            # In an SDK every package defaults to =m, so without these the
            # PCIe, USB and Bluetooth-USB variants get built too - none of
            # which this board has, and each of which is another way for the
            # run to fail on code we do not ship.
            echo '# CONFIG_PACKAGE_kmod-aic8800-pcie is not set'
            echo '# CONFIG_PACKAGE_kmod-aic8800-usb is not set'
            echo '# CONFIG_PACKAGE_kmod-aic8800-btusb is not set'
            echo '# CONFIG_PACKAGE_aic8800-pcie-firmware is not set'
            echo '# CONFIG_PACKAGE_aic8800-usb-firmware is not set'
          } > .config
          make defconfig

          fail=0
          grep -qx 'CONFIG_PACKAGE_kmod-aic8800-sdio=m' .config \
            || { echo "::error::kmod-aic8800-sdio is not selected after defconfig"; fail=1; }
          grep -qE '^CONFIG_PACKAGE_aic8800-sdio-firmware=[ym]' .config \
            || { echo "::error::aic8800-sdio-firmware is not selected after defconfig"; fail=1; }
          # The driver includes the backport headers directly; if cfg80211 is
          # not being built, those headers never land in staging_dir and the
          # compile fails deep inside the vendor source with no useful message.
          grep -qE '^CONFIG_PACKAGE_kmod-cfg80211=[ym]' .config \
            || { echo "::error::kmod-cfg80211 did not get pulled in - is the base feed installed?"; fail=1; }
          for p in kmod-aic8800-pcie kmod-aic8800-usb kmod-aic8800-btusb \
                   aic8800-pcie-firmware aic8800-usb-firmware; do
            # `if` and not `&&`: this step runs under `bash -e`, where a
            # trailing AND-list whose test fails would abort the step - and
            # here the test failing is the outcome we want.
            if grep -qE "^CONFIG_PACKAGE_$p=[ym]" .config; then
              echo "::error::$p came back on after defconfig - only the SDIO variant should build"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "----- selected aic8800 / mac80211 options -----"
          grep -E 'aic8800|cfg80211|mac80211=' .config || true

      - name: Build
        run: |
          cd "$SDK_DIR"
          make package/aic8800/compile -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || 'V=s' }}

      - name: Assert the kernel ABI matches the published 25.12.5 feed
        run: |
          cd "$SDK_DIR"
          # An SDK never builds a kernel, so it has no .vermagic file. The
          # value is baked into include/kernel.mk when the SDK is packaged -
          # target/sdk/Makefile substitutes it for the "unknown" fallback on
          # the LINUX_VERMAGIC line - and that is what every kmod built here
          # gets stamped with.
          ACTUAL=$(grep 'LINUX_VERMAGIC' include/kernel.mk | grep -oE '[0-9a-f]{32}' | head -1) || true
          [ -n "$ACTUAL" ] \
            || { echo "::error::could not read LINUX_VERMAGIC out of the SDK's include/kernel.mk"; exit 1; }
          echo "SDK vermagic:      $ACTUAL"
          echo "expected vermagic: $EXPECTED_VERMAGIC"
          [ "$ACTUAL" = "$EXPECTED_VERMAGIC" ] \
            || { echo "::error::vermagic is $ACTUAL, expected $EXPECTED_VERMAGIC - the module would not load on a stock image"; exit 1; }

          APK=$(find bin -name 'kmod-aic8800-sdio-*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::kmod-aic8800-sdio apk was not produced"; exit 1; }
          echo "package: $APK"
          # The above is what the SDK intends; this is what apk will actually
          # check on the device, so read it back off the package rather than
          # trusting the build to have used it.
          DEP=$(staging_dir/host/bin/apk adbdump "$APK" 2>/dev/null \
                | grep -oE "kernel=[0-9.]+~[0-9a-f]{32}-r[0-9]+" | head -1) || true
          if [ -n "$DEP" ]; then
            echo "declared dependency: $DEP"
            case "$DEP" in
              *"~$EXPECTED_VERMAGIC-"*)
                echo "the package depends on the published kernel ABI" ;;
              *)
                echo "::error::the package declares $DEP, which is not ~$EXPECTED_VERMAGIC"
                exit 1 ;;
            esac
          else
            echo "::warning::could not read the package metadata with apk; the SDK vermagic check above already gates this"
          fi

      - name: Verify the built modules and firmware
        run: |
          cd "$SDK_DIR"
          fail=0
          for m in aic8800_bsp aic8800_fdrv; do
            f=$(find build_dir -name "$m.ko" 2>/dev/null | head -1) || true
            if [ -z "$f" ]; then
              echo "::error::$m.ko was not built"
              fail=1
              continue
            fi
            # The kernel's own vermagic, which is not OpenWrt's hash but does
            # say what this was compiled for. A module built against the wrong
            # kernel would still produce a file and an apk.
            vm=$(strings "$f" | grep -m1 '^vermagic=') || true
            echo "--- $m.ko: ${vm:-(no vermagic string)}"
            case "$vm" in
              *6.12.94*aarch64*) ;;
              *) echo "::error::$m.ko was not built for 6.12.94/aarch64"; fail=1 ;;
            esac
          done

          # The R28S carries an AIC8800D80, and without its blobs the driver
          # loads and then fails to bring the chip up. Read the package rather
          # than the staged directory the last run looked at: OpenWrt deletes
          # that as soon as it has made the apk, so it was reliably absent by
          # the time this step ran.
          for p in kmod-aic8800-sdio aic8800-sdio-firmware; do
            a=$(find bin -name "$p-*.apk" | head -1) || true
            if [ -z "$a" ]; then
              echo "::error::$p apk was not produced"
              fail=1
              continue
            fi
            echo "--- $a"
            if [ "$p" = aic8800-sdio-firmware ]; then
              dump=$(staging_dir/host/bin/apk adbdump "$a" 2>/dev/null) || true
              if [ -n "$dump" ]; then
                n=$(printf '%s\n' "$dump" | grep -ci '8800d80') || true
                echo "    ${n:-0} D80 firmware entries"
                [ "${n:-0}" -gt 0 ] \
                  || { echo "::error::the firmware package carries no aic8800D80 blobs"; fail=1; }
              else
                echo "::warning::could not read $a with apk; falling back to the source tree"
                d=$(find build_dir -type d -path '*SDIO/driver_fw/fw/aic8800D80' | head -1) || true
                [ -n "$d" ] \
                  || { echo "::error::no aic8800D80 firmware directory in the vendor source either"; fail=1; }
              fi
            fi
          done
          [ "$fail" = 0 ] || exit 1

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          find "$SDK_DIR/bin" -name '*aic8800*.apk' -exec cp -v {} artifacts/ \;
          cp -v "$SDK_DIR/.config" artifacts/build.config
          ( cd artifacts && sha256sum *.apk > sha256sums )
          ls -lh artifacts/
          ls artifacts/ | grep -q 'kmod-aic8800-sdio' \
            || { echo "::error::no kmod-aic8800-sdio apk in the artifacts"; exit 1; }
          ls artifacts/ | grep -q 'aic8800-sdio-firmware' \
            || { echo "::error::no aic8800-sdio-firmware apk in the artifacts"; exit 1; }

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-25.12.5-rockchip-armv8-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('aic8800-25.12.5-build-{0}', github.run_number) }}
          name: aic8800 for OpenWrt 25.12.5 rockchip/armv8 (${{ github.ref_name }})
          files: artifacts/*
          body: |
            AICSemi **AIC8800** Wi-Fi driver built as standalone apk packages for
            **OpenWrt 25.12.5, rockchip/armv8** (`aarch64_generic`).

            Built with the official 25.12.5 SDK, so the modules carry the published
            kernel ABI (`${{ env.EXPECTED_KERNEL }}-${{ env.EXPECTED_VERMAGIC }}`) and
            install on a stock 25.12.5 rockchip image.

            ### Install

            Copy the two apk files to the device and:

            ```
            apk add --allow-untrusted ./aic8800-sdio-firmware-*.apk ./kmod-aic8800-sdio-*.apk
            apk add wpad-basic-mbedtls        # if the image has no supplicant yet
            reboot
            ```

            `wpad-*` comes from the official feed, which a stock image already has
            configured.

            ### What this is for

            The SDIO packages drive the **AIC8800D80** module found on boards such as
            the FriendlyElec NanoPi R28S (`SKI.WB800D80S.1`), which has no mainline
            driver at all. The device tree on those builds already describes the SDIO
            host, so the card is detected before this driver is installed - there is
            simply nothing bound to it.

            Bluetooth over SDIO is compiled in (`AIC8800_SDIO_BT_SUPPORT=y`); it needs
            `kmod-bluetooth`, which apk pulls in.

            ### Source

            Driver: [radxa-pkg/aic8800](https://github.com/radxa-pkg/aic8800) pinned at
            `89f865b8`. The OpenWrt packaging and patches are ImmortalWrt's
            `package/kernel/aic8800`, unmodified - they were written against backports
            6.18.39, which is exactly what OpenWrt 25.12 ships.

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.ref_name }}
          path: |
            ${{ env.SDK_DIR }}/logs/
            ${{ env.SDK_DIR }}/.config
          retention-days: 14
          if-no-files-found: ignore
